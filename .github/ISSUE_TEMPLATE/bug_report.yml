name: Bug Report
description: Report a bug to help us improve the project
title: '[BUG]: '
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: checkboxes
    id: program
    attributes:
      label: Contributor Program
      options:
        - label: ECSoC 2026

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected & Actual Behavior
      description: What you expected to happen vs what actually happened.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: OS, Python/Node version, Browser, etc.
    validations:
      required: false
