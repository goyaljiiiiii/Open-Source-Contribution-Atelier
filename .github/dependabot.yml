version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "security"
      - "dependencies"
    assignees:
      - "Shruti070107"
    groups:
      django:
        patterns:
          - "django*"
          - "djangorestframework*"
        update-types:
          - "minor"
          - "patch"
      celery:
        patterns:
          - "celery*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "pytest*"
          - "factory-boy"
          - "Faker"
        update-types:
          - "minor"
          - "patch"
      aws:
        patterns:
          - "boto3*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "Django"
        versions: [">=5.1"]
      - dependency-name: "psycopg"
        versions: [">=3.3"]
    vendor: false

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "security"
      - "dependencies"
    assignees:
      - "Shruti070107"
    groups:
      react:
        patterns:
          - "react*"
          - "@react*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "@testing-library/*"
          - "@vitest/*"
          - "@playwright/*"
          - "vitest"
          - "playwright"
        update-types:
          - "minor"
          - "patch"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.0"]
    vendor: false

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "security"
      - "docker"
    assignees:
      - "Shruti070107"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "security"
      - "docker"
    assignees:
      - "Shruti070107"
