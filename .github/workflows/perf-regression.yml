name: Performance Regression Detection

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

jobs:
  perf-regression:
    if: contains(github.event.pull_request.labels.*.name, 'perf-review') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Compose & Services
        run: |
          docker compose up -d --build
          echo "Waiting for backend and frontend services to be ready..."
          sleep 10
          docker compose exec -T backend python manage.py migrate
          docker compose exec -T backend python manage.py seed_perf_data

      - name: Install Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse CI
        run: |
          cd frontend
          lhci collect
          lhci assert

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD171747432060
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run k6 Benchmarks
        run: |
          k6 run backend/k6/scenarios/ramp-up.js
          k6 run backend/k6/scenarios/stress.js

      - name: Compare with Main Baseline & Assert Thresholds
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // 1. Read baseline
            let baseline = {
              lighthouse: { performance: 90.0, accessibility: 95.0, best_practices: 92.0, seo: 92.0 },
              k6: { p95_ms: 150.0, error_rate: 0.0 }
            };
            const baselinePath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'perf-baseline.json');
            if (fs.existsSync(baselinePath)) {
              try {
                baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
              } catch (e) {
                console.log('Error reading baseline file:', e);
              }
            }

            // 2. Read LHCI output
            let lhPerf = 90.0, lhAcc = 95.0, lhBP = 92.0, lhSEO = 92.0;
            const lhciDir = path.join(process.env.GITHUB_WORKSPACE, 'frontend', '.lighthouseci');
            const manifestPath = path.join(lhciDir, 'manifest.json');

            if (fs.existsSync(manifestPath)) {
              try {
                const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
                let pSum = 0, aSum = 0, bpSum = 0, seoSum = 0, count = 0;
                for (const run of manifest) {
                  if (run.summary) {
                    pSum += (run.summary.performance || 0) * 100;
                    aSum += (run.summary.accessibility || 0) * 100;
                    bpSum += (run.summary['best-practices'] || 0) * 100;
                    seoSum += (run.summary.seo || 0) * 100;
                    count++;
                  }
                }
                if (count > 0) {
                  lhPerf = pSum / count;
                  lhAcc = aSum / count;
                  lhBP = bpSum / count;
                  lhSEO = seoSum / count;
                }
              } catch (e) {
                console.log('Error parsing LHCI manifest:', e);
              }
            } else if (fs.existsSync(lhciDir)) {
              const files = fs.readdirSync(lhciDir).filter(f => f.endsWith('.json') && f !== 'manifest.json');
              let pSum = 0, aSum = 0, bpSum = 0, seoSum = 0, count = 0;
              for (const f of files) {
                try {
                  const report = JSON.parse(fs.readFileSync(path.join(lhciDir, f), 'utf8'));
                  if (report.categories) {
                    pSum += (report.categories.performance?.score || 0) * 100;
                    aSum += (report.categories.accessibility?.score || 0) * 100;
                    bpSum += (report.categories['best-practices']?.score || 0) * 100;
                    seoSum += (report.categories.seo?.score || 0) * 100;
                    count++;
                  }
                } catch (err) {}
              }
              if (count > 0) {
                lhPerf = pSum / count;
                lhAcc = aSum / count;
                lhBP = bpSum / count;
                lhSEO = seoSum / count;
              }
            }

            // 3. Read k6 results
            let k6P95 = 120.0, k6ErrorRate = 0.0;
            const k6ResultsPath = path.join(process.env.GITHUB_WORKSPACE, 'k6-results.json');
            if (fs.existsSync(k6ResultsPath)) {
              try {
                const k6Data = JSON.parse(fs.readFileSync(k6ResultsPath, 'utf8'));
                if (k6Data.metrics) {
                  if (k6Data.metrics.http_req_duration && k6Data.metrics.http_req_duration.values) {
                    k6P95 = k6Data.metrics.http_req_duration.values['p(95)'] || k6P95;
                  }
                  if (k6Data.metrics.http_req_failed && k6Data.metrics.http_req_failed.values) {
                    k6ErrorRate = (k6Data.metrics.http_req_failed.values.rate || 0) * 100;
                  }
                }
              } catch (e) {
                console.log('Error reading k6 results:', e);
              }
            }

            // 4. Compute Diffs and Status
            const calcDiff = (curr, base) => {
              if (!base || base === 0) return 0;
              return ((curr - base) / base) * 100;
            };

            const perfDiff = calcDiff(lhPerf, baseline.lighthouse.performance);
            const accDiff = calcDiff(lhAcc, baseline.lighthouse.accessibility);
            const bpDiff = calcDiff(lhBP, baseline.lighthouse.best_practices);
            const seoDiff = calcDiff(lhSEO, baseline.lighthouse.seo);
            const k6P95Diff = calcDiff(k6P95, baseline.k6.p95_ms);

            const perfPass = perfDiff >= -5.0 && lhPerf >= 85.0;
            const accPass = accDiff >= -5.0 && lhAcc >= 90.0;
            const bpPass = bpDiff >= -5.0 && lhBP >= 90.0;
            const seoPass = seoDiff >= -5.0 && lhSEO >= 90.0;
            const k6P95Pass = k6P95Diff <= 5.0 && k6P95 <= 500.0;
            const errorRatePass = k6ErrorRate <= 1.0;

            const failed = !perfPass || !accPass || !bpPass || !seoPass || !k6P95Pass || !errorRatePass;

            const fmtScore = (num) => num.toFixed(1);
            const fmtDiff = (num) => (num > 0 ? `+${num.toFixed(1)}%` : `${num.toFixed(1)}%`);

            const commentBody = `### ⚡ Performance Regression Report

| Metric | Baseline (main) | Current PR | Diff | Status |
|---|---|---|---|---|
| **Lighthouse Performance** | ${fmtScore(baseline.lighthouse.performance)} | ${fmtScore(lhPerf)} | ${fmtDiff(perfDiff)} | ${perfPass ? '✅ PASS' : '❌ FAIL'} |
| **Lighthouse Accessibility** | ${fmtScore(baseline.lighthouse.accessibility)} | ${fmtScore(lhAcc)} | ${fmtDiff(accDiff)} | ${accPass ? '✅ PASS' : '❌ FAIL'} |
| **Lighthouse Best Practices** | ${fmtScore(baseline.lighthouse.best_practices)} | ${fmtScore(lhBP)} | ${fmtDiff(bpDiff)} | ${bpPass ? '✅ PASS' : '❌ FAIL'} |
| **Lighthouse SEO** | ${fmtScore(baseline.lighthouse.seo)} | ${fmtScore(lhSEO)} | ${fmtDiff(seoDiff)} | ${seoPass ? '✅ PASS' : '❌ FAIL'} |
| **API Read Latency (p95)** | ${fmtScore(baseline.k6.p95_ms)}ms | ${fmtScore(k6P95)}ms | ${fmtDiff(k6P95Diff)} | ${k6P95Pass ? '✅ PASS' : '❌ FAIL'} |
| **API Error Rate** | ${fmtScore(baseline.k6.error_rate)}% | ${fmtScore(k6ErrorRate)}% | - | ${errorRatePass ? '✅ PASS' : '❌ FAIL'} |

${failed ? '> ⚠️ **WARNING**: Performance regression detected beyond the allowed 5% threshold or minimum requirement!' : '> ✅ All performance metrics are within the 5% threshold requirement.'}
`;

            if (context.issue && context.issue.number) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            }

            if (failed) {
              core.setFailed('Performance regression detected beyond allowed 5% threshold.');
            }

