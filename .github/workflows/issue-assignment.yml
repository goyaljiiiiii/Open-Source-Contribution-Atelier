name: Issue Assignment & ECSoC Labeler

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  auto-label-and-triage:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Check Quality & Label Issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = (issue.title || '').trim();
            const body = (issue.body || '').trim();

            // 1. Low-Quality Issue Auto-Triage Check
            if (title.length < 10 || body.length < 30) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: 'needs-more-info' });
              } catch (e) {
                await github.rest.issues.createLabel({
                  owner, repo, name: 'needs-more-info', color: 'fef2c0', description: 'Requires additional details'
                });
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['needs-more-info'] });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `⚠️ @${issue.user.login}, thank you for creating this issue! Please provide additional details (e.g. reproduction steps, environment details, or problem description) so maintainers can review and assign it.`
              });
              console.log(`Labeled issue #${issue.number} as needs-more-info due to brevity.`);
            }

            // 2. Check if ECSoC 2026 checkbox is checked
            const isEcsocChecked = /-\s*\[x\]\s*ecsoc\s*2026/i.test(body) ||
                                   /-\s*\[x\]\s*ecsoc/i.test(body) ||
                                   /-\s*\[x\]\s*ecosc/i.test(body) ||
                                   /-\s*\[x\]\s*ssoc/i.test(body);

            if (isEcsocChecked) {
              const labelName = 'ECSoC26';
              try {
                await github.rest.issues.getLabel({ owner, repo, name: labelName });
              } catch (e) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: labelName,
                  color: 'd4c5f9',
                  description: 'ECSoC 2026 Program Issue'
                });
              }
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: [labelName]
              });
              console.log(`Added label ${labelName} to issue #${issue.number}`);
            }

  handle-issue-assignment:
    if: github.event_name == 'issue_comment' && github.event.action == 'created'
    runs-on: ubuntu-latest
    steps:
      - name: Process Claim / Unclaim Commands
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = context.payload.comment;
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Ignore PR comments
            if (issue.pull_request) return;

            // Ignore bot comments
            if (comment.user.type === 'Bot' || comment.user.login.endsWith('[bot]')) return;

            const commenter = comment.user.login;
            const commentText = (comment.body || '').toLowerCase();
            const existingAssignees = (issue.assignees || []).map(a => a.login);

            // Handle /unclaim or !unclaim command
            if (commentText.includes('/unclaim') || commentText.includes('!unclaim')) {
              if (existingAssignees.includes(commenter)) {
                await github.rest.issues.removeAssignees({
                  owner,
                  repo,
                  issue_number: issue.number,
                  assignees: [commenter]
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `🛠️ @${commenter} has **unclaimed** this issue. It is now open for other contributors.`
                });
              }
              return;
            }

            // Check if comment is claiming the issue
            const isClaimCommand = /\b(\/claim|!claim|\/assign|!assign|claim)\b/i.test(commentText) ||
                                 /\b(can i work|can i take|can i claim|i want to work|i'd like to work|please assign|can i be assigned|assign me|i want to contribute|can i contribute)\b/i.test(commentText) ||
                                 /\b(ecsoc26?|ecosc|ssoc26?)\b/i.test(commentText);

            if (!isClaimCommand) return;

            // Check if issue is already assigned to a non-author user
            const nonAuthorAssignees = existingAssignees.filter(a => a !== issue.user.login);
            if (nonAuthorAssignees.length > 0) {
              if (!existingAssignees.includes(commenter)) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `⚠️ @${commenter}, this issue is already assigned to @${nonAuthorAssignees.join(', @')}.`
                });
              }
              return;
            }

            // Check if the issue has the ECSoC26 label
            const issueLabels = (issue.labels || []).map(l => l.name.toLowerCase());
            const isEcsocIssue = issueLabels.some(l => l.includes('ecsoc') || l.includes('ecosc') || l.includes('ssoc') || l === 'ecsoc26');

            if (isEcsocIssue) {
              const hasEcsocKeyword = /\b(ecsoc26?|ecsoc\s*2026|ecosc|ssoc26?|ssoc)\b/i.test(commentText);

              if (!hasEcsocKeyword) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `⚠️ @${commenter}, this issue is reserved for **ECSoC 2026** contributors! To claim this issue, please include the keyword \`ecsoc26\` or \`ecosc\` in your comment (e.g., \`/claim ecsoc26\`).`
                });
                return;
              }
            }

            // Enforce max 5 assigned issues limit per user
            try {
              const assignedIssues = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                assignee: commenter
              });
              if (assignedIssues.data.length >= 5) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `⚠️ @${commenter}, you currently have **${assignedIssues.data.length} assigned open issues** (the maximum allowed per contributor is **5**). Please complete or unclaim your existing assigned issues before claiming new ones!`
                });
                return;
              }
            } catch (limitErr) {
              console.warn('Could not check assignee issue count:', limitErr);
            }

            // Assign the user
            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: issue.number,
                assignees: [commenter]
              });

              const ecsocNotice = isEcsocIssue ? ' under **ECSoC 2026**' : '';
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: [
                  `### 🚀 Assigned to @${commenter}${ecsocNotice}! 🎉`,
                  ``,
                  `Issue successfully assigned to @${commenter}!`,
                  `1. Please link this issue in your Pull Request description using \`Fixes #${issue.number}\`.`,
                  `2. Run local tests before requesting review.`,
                  ``,
                  `Happy coding! 🎉 — @${owner}`
                ].join('\n')
              });
            } catch (err) {
              console.error(`Failed to assign issue #${issue.number} to ${commenter}:`, err);
            }
