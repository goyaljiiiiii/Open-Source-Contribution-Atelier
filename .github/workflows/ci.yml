name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: ✅ Python ${{ matrix.python-version }} (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        shard: [1, 2, 3]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      
      - name: Install dependencies
        run: |
          cd backend || exit 0
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest-xdist pytest-split pytest-cov ruff black isort mypy
      
      - name: Run Quality Checks
        run: |
          cd backend || exit 0
          ruff check . || true
          black --check . || true
          isort --check-only . || true
          mypy . || true
      
      - name: Run tests (shard ${{ matrix.shard }})
        run: |
          cd backend || exit 0
          pytest --splits 3 --group ${{ matrix.shard }} --cov=. --cov-report=xml || true
      
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml

  frontend-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd frontend || exit 0
          if [ -f package.json ]; then npm ci; fi
      
      - name: Run tests (shard ${{ matrix.shard }})
        run: |
          cd frontend || exit 0
          if [ -f package.json ]; then npm run test -- --shard=${{ matrix.shard }}/2; fi

  bundle-size-check:
    name: 📦 Bundle Size & Budget Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build & Check Bundle Size
        run: |
          cd frontend
          npm run analyze-bundle

