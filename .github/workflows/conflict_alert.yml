name: PR Conflict Detection Alert

on:
  schedule:
    - cron: '0 12 * * *'   # once daily at noon UTC
  pull_request_target:
    types: [synchronize, reopened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  check-conflicts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check open PRs for merge conflicts
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', per_page: 100});

            for (const pr of prs) {
              if (pr.draft) continue;

              try {
                const {data: prDetail} = await github.rest.pulls.get({owner, repo, pull_number: pr.number});

                if (prDetail.mergeable === false) {
                  const author = pr.user.login;
                  const commentBody = `⚠️ @${author}, your Pull Request **#${pr.number}** has **merge conflicts** with the \`main\` branch. Please rebase or merge \`main\` locally to resolve conflicts so maintainers can merge it!`;

                  const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: pr.number});
                  const existing = comments.filter(c =>
                    c.user.type === 'Bot' && c.body.includes('merge conflict')
                  );

                  if (existing.length === 0) {
                    await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body: commentBody});
                  } else {
                    const last = existing[existing.length - 1];
                    if (last.body !== commentBody) {
                      await github.rest.issues.updateComment({owner, repo, comment_id: last.id, body: commentBody});
                    }
                  }
                }
              } catch (e) {
                console.warn(`Could not check mergeability for PR #${pr.number}: ${e}`);
              }
            }
