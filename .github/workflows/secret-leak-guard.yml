name: Secret & Credential Leak Guard

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  scan-for-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Scan PR Diff for Hardcoded Credentials & Secrets
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100
            });

            const secretRegexes = [
              { name: 'Stripe Webhook Secret', regex: /whsec_[a-zA-Z0-9]{24,}/ },
              { name: 'Stripe Live Secret Key', regex: /sk_live_[a-zA-Z0-9]{24,}/ },
              { name: 'AWS Access Key', regex: /AKIA[0-9A-Z]{16}/ },
              { name: 'GitHub Personal Access Token', regex: /(ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{50,})/ },
              { name: 'Private Key Block', regex: /-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----/ }
            ];

            const forbiddenFiles = ['.env', '.env.local', '.env.production', 'id_rsa', 'id_rsa.pub'];
            const leaks = [];

            for (const file of files) {
              const basename = file.filename.split('/').pop();

              if (forbiddenFiles.includes(basename)) {
                leaks.push(`Forbidden secret file committed: \`${file.filename}\``);
                continue;
              }

              const patch = file.patch || '';
              const addedLines = patch.split('\n').filter(line => line.startsWith('+') && !line.startsWith('+++'));

              for (const line of addedLines) {
                for (const rule of secretRegexes) {
                  if (rule.regex.test(line)) {
                    leaks.push(`Detected potential **${rule.name}** in \`${file.filename}\``);
                  }
                }
              }
            }

            if (leaks.length > 0) {
              const alertBody = [
                `🚨 **SECURITY ALERT: Potential Hardcoded Secret Leak Detected!**`,
                ``,
                `The security scanner identified potential hardcoded credentials or secret files in this Pull Request:`,
                ...leaks.map(l => `- ❌ ${l}`),
                ``,
                `> 🛑 **Action Required**: Please remove the hardcoded secret, revoke/rotate any exposed API keys immediately, and push a fresh commit.`
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: alertBody
              });

              core.setFailed(`Security secret leak check failed due to exposed credentials in PR #${pr.number}`);
            } else {
              console.log(`No exposed secrets found in PR #${pr.number}. Security check passed.`);
            }
