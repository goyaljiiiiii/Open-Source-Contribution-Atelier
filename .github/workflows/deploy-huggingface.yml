name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean binary files & push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          import subprocess, os, tempfile

          repo_dir = os.getcwd()
          print('Preparing Hugging Face sync...')

          with tempfile.TemporaryDirectory() as temp_dir:
              tar_path = os.path.join(temp_dir, 'archive.tar')
              subprocess.run(['git', 'archive', '--format=tar', 'HEAD', '-o', tar_path], cwd=repo_dir, check=True)
              subprocess.run(['tar', '-xf', tar_path, '-C', temp_dir], check=True)
              os.remove(tar_path)

              binary_extensions = ['.png', '.jpg', '.jpeg', '.gif', '.webm', '.mp4', '.sqlite3', '.sqlite3-wal', '.sqlite3-shm', '.gz', '.pack', '.idx', '.zip', '.tar']
              ignored_names = ['social-preview.png', 'addon-library.png']

              for root, dirs, files in os.walk(temp_dir):
                  for f in files:
                      file_path = os.path.join(root, f)
                      ext = os.path.splitext(f)[1].lower()
                      if ext in binary_extensions or f in ignored_names or 'timeline' in f or 'test-results' in root or '.next' in root:
                          try:
                              os.remove(file_path)
                          except Exception:
                              pass

              subprocess.run(['git', 'init', '-b', 'main'], cwd=temp_dir, check=True)
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], cwd=temp_dir, check=True)
              subprocess.run(['git', 'config', 'user.email', 'github-actions[bot]@users.noreply.github.com'], cwd=temp_dir, check=True)

              subprocess.run(['git', 'add', '.'], cwd=temp_dir, check=True)
              subprocess.run(['git', 'commit', '-m', 'deploy: auto-sync to Hugging Face Space [skip ci]'], cwd=temp_dir, check=True)

              hf_token = os.environ.get('HF_TOKEN', '')
              if hf_token:
                  remote_url = f'https://nandinigoyaldev:{hf_token}@huggingface.co/spaces/nandinigoyaldev/atelier-backend'
              else:
                  remote_url = 'https://huggingface.co/spaces/nandinigoyaldev/atelier-backend'

              subprocess.run(['git', 'remote', 'add', 'hf', remote_url], cwd=temp_dir, check=True)
              res = subprocess.run(['git', 'push', 'hf', 'main', '--force'], cwd=temp_dir, capture_output=True, text=True)
              if res.returncode == 0:
                  print('Successfully synced to Hugging Face Space!')
              else:
                  print(f'Sync error: {res.stderr}')
          "
